<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>沸点创意 · Agent 控制台</title>
<style>
  :root {
    --orange: #FF5A1F;
    --red: #E8362B;
    --graphite: #16181D;
    --blue: #2F6BFF;
    --yellow: #FFB020;
    --bg: #F7F8FA;
    --card: #FFFFFF;
    --text: #1F2329;
    --muted: #8A919F;
    --border: #E5E6EB;
    --green: #18A058;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.6;
  }
  header {
    background: var(--graphite); color: #fff; padding: 14px 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .5px; }
  header .sub { color: #9aa0ab; font-size: 12px; }
  header .spacer { flex: 1; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .dot.ok { background: var(--green); }
  .dot.degraded { background: var(--yellow); }
  .dot.failed { background: var(--red); }
  .dot.unknown { background: var(--muted); }
  button {
    border: 1px solid var(--border); background: #fff; color: var(--text);
    border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: 13px;
    font-family: inherit;
  }
  button:hover { border-color: var(--orange); color: var(--orange); }
  button.primary { background: var(--orange); border-color: var(--orange); color: #fff; }
  button.primary:hover { background: #e8480f; color: #fff; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px; }
  .grid { display: grid; gap: 14px; }
  .g6 { grid-template-columns: repeat(6, 1fr); }
  .g2 { grid-template-columns: 1.35fr 1fr; }
  .g3 { grid-template-columns: repeat(3, 1fr); }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px;
    box-shadow: 0 2px 12px rgba(22,24,29,.06);
  }
  .card h3 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
  .card h3 small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 8px; }
  .kpi .v { font-size: 24px; font-weight: 700; line-height: 1.2; }
  .kpi .k { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .kpi .x { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .grade { display:inline-block; padding: 1px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; color:#fff; margin-left:6px; }
  .grade.A { background: var(--green); }
  .grade.B { background: var(--blue); }
  .grade.C { background: var(--yellow); }
  .grade.D { background: var(--red); }
  .headline {
    background: linear-gradient(90deg, rgba(255,90,31,.08), rgba(255,90,31,0));
    border-left: 3px solid var(--orange); padding: 12px 14px; border-radius: 8px;
    font-size: 14px; font-weight: 500;
  }
  ul.log { list-style: none; margin: 0; padding: 0; }
  ul.log li { padding: 7px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
  ul.log li:last-child { border-bottom: none; }
  .tag {
    display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 11px;
    background: #F2F3F5; color: #4E5969; margin-right: 6px;
  }
  .tag.ok { background: rgba(24,160,88,.12); color: var(--green); }
  .tag.warn { background: rgba(255,176,32,.16); color: #B26A00; }
  .tag.error { background: rgba(232,54,43,.12); color: var(--red); }
  .tag.info { background: rgba(47,107,255,.12); color: var(--blue); }
  .bar { height: 6px; background: #F2F3F5; border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; background: var(--orange); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.k { color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .spark { display: flex; align-items: flex-end; gap: 6px; height: 60px; }
  .spark div { flex: 1; background: var(--orange); border-radius: 3px 3px 0 0; opacity: .85; position: relative; }
  .spark div span {
    position: absolute; bottom: -18px; left: 0; right: 0; text-align: center;
    font-size: 10px; color: var(--muted);
  }
  pre.md {
    background: #FBFCFD; border: 1px solid var(--border); border-radius: 8px;
    padding: 14px; max-height: 460px; overflow: auto; font-size: 12.5px; line-height: 1.7;
    white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace;
  }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .flash { color: var(--muted); font-size: 12px; }
  .row-flex { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  @media (max-width: 900px) { .g6 { grid-template-columns: repeat(3, 1fr); } .g2, .g3 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>沸点创意 · Agent 控制台</h1>
  <span class="sub">内容情报 Agent｜每日抖音爆款抓取 · 四维拆解 · 趋势报告</span>
  <span class="spacer"></span>
  <span class="flash" id="conn">连接中…</span>
  <button id="btnPlan">查看计划</button>
  <button id="btnRun">立即值守</button>
  <button class="primary" id="btnForce">强制刷新今日</button>
</header>

<main>
  <div class="card headline" id="headline">正在加载 Agent 状态…</div>

  <div style="height:14px"></div>

  <div class="grid g6" id="kpis"></div>

  <div style="height:14px"></div>

  <div class="grid g2">
    <div class="card">
      <h3>本轮执行 <small>思考痕迹 · 每个动作都有理由</small></h3>
      <ul class="log" id="actions"><li class="empty">—</li></ul>
    </div>
    <div class="card">
      <h3>质检结果 <small>出厂自检</small></h3>
      <ul class="log" id="issues"><li class="empty">—</li></ul>
      <div style="height:10px"></div>
      <h3>下一步 <small>Agent 给自己派的下轮任务</small></h3>
      <ul class="log" id="next"><li class="empty">—</li></ul>
    </div>
  </div>

  <div style="height:14px"></div>

  <div class="grid g2">
    <div class="card">
      <h3>今日受众偏爱 <small>报告结论</small></h3>
      <ul class="log" id="insight"><li class="empty">—</li></ul>
    </div>
    <div class="card">
      <h3>近 7 次健康分</h3>
      <div class="spark" id="spark"></div>
      <div style="height:26px"></div>
      <table>
        <thead><tr><th>指标</th><th>值</th></tr></thead>
        <tbody id="agentStats"></tbody>
      </table>
    </div>
  </div>

  <div style="height:14px"></div>

  <div class="grid g2">
    <div class="card">
      <h3>长期记忆 <small>跨天累积的经验，置信度随证据更新</small></h3>
      <table>
        <thead><tr><th style="width:32%">键</th><th>值</th><th style="width:80px">置信度</th><th style="width:52px">命中</th></tr></thead>
        <tbody id="memory"></tbody>
      </table>
    </div>
    <div class="card">
      <h3>问题与洞察 <small>按严重级别归档</small></h3>
      <ul class="log" id="findings"><li class="empty">—</li></ul>
    </div>
  </div>

  <div style="height:14px"></div>

  <div class="card">
    <h3>CEO 简报 <small id="briefMeta"></small></h3>
    <pre class="md" id="brief">—</pre>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
let LAST = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!j.ok) throw new Error(j.error?.message || '请求失败');
  return j.data;
}

function renderKpis(s) {
  const today = s.today;
  const kpi = today?.brief?.kpi || {};
  const stats = s.stats || {};
  const items = [
    { k: '健康分', v: today ? `${today.healthScore}<span class="grade ${today.grade}">${today.grade}</span>` : '—', x: today ? today.status : '今日尚未值守' },
    { k: '数据源', v: kpi.source || today?.source || '—', x: kpi.source === 'douyin' ? '真实榜单' : '演示数据（未接真实源）' },
    { k: '样本数', v: kpi.sampleSize ?? today?.sampleSize ?? '—', x: '每日 TOP10' },
    { k: '平均爆款指数', v: kpi.avgBoilingScore ?? '—', x: '榜单内相对分位' },
    { k: '主导题材', v: kpi.topTopic || '—', x: `时长 ${kpi.preferredDuration || '—'}` },
    { k: '累计成功率', v: `${stats.successRate ?? 0}%`, x: `值守 ${stats.total ?? 0} 次 · 均分 ${stats.avgHealthScore ?? 0}` },
  ];
  $('kpis').innerHTML = items.map((i) => `
    <div class="card kpi" style="padding:12px 14px">
      <div class="v">${i.v}</div>
      <div class="k">${esc(i.k)}</div>
      <div class="x">${esc(i.x)}</div>
    </div>`).join('');
}

function renderRun(s) {
  const today = s.today;
  if (!today) {
    $('headline').textContent = '今日尚未值守，点击右上角「立即值守」启动 Agent。';
    ['actions', 'issues', 'next', 'insight'].forEach((id) => { $(id).innerHTML = '<li class="empty">—</li>'; });
    $('brief').textContent = '—';
    return;
  }
  $('headline').innerHTML = `<span class="dot ${today.status}"></span>${esc(today.message || today.brief?.headline || '')}`;

  const acts = today.actions || [];
  $('actions').innerHTML = acts.length
    ? acts.map((a) => `<li>
        <span class="tag ${a.ok === false ? 'error' : 'ok'}">${a.ok === false ? '失败' : '成功'}</span>
        <b>${esc(a.type)}</b>｜${esc(a.summary)}${a.ms ? ` <span class="flash">${a.ms}ms</span>` : ''}
        ${a.reason ? `<div class="flash">理由：${esc(a.reason)}</div>` : ''}
      </li>`).join('')
    : '<li class="empty">本轮无动作</li>';

  const issues = today.issues || [];
  $('issues').innerHTML = issues.length
    ? issues.map((i) => `<li><span class="tag ${i.severity}">${esc(i.severity)}</span><b>${esc(i.label)}</b>：${esc(i.message)}</li>`).join('')
    : '<li class="empty">全部检查项通过</li>';

  const next = today.brief?.nextActions || [];
  $('next').innerHTML = next.length
    ? next.map((n, i) => `<li>${i + 1}. ${esc(n)}</li>`).join('')
    : '<li class="empty">无</li>';

  const secs = today.brief?.sections || [];
  const ins = secs.find((x) => x.title.includes('受众偏爱'));
  const hw = LAST?.report?.audienceInsight?.realHotWords || [];
  const hwHtml = hw.length
    ? `<li style="border-top:1px solid var(--border);padding-top:10px">
         <div style="margin-bottom:6px"><b>抖音实时热搜榜</b>
           <span class="tag ok" style="margin-left:6px">真实数据 · 官方接口</span></div>
         ${hw.slice(0, 8).map((w) => `<span class="tag ${w.labelText === '爆' ? 'error' : w.labelText === '新' ? 'ok' : 'info'}">#${esc(w.word)} ${w.hotValue > 1e4 ? (w.hotValue / 1e4).toFixed(0) + '万' : w.hotValue}</span>`).join('')}
         <div class="flash" style="margin-top:6px">热搜话题来自抖音官方公开接口，与视频榜数据源相互独立</div>
       </li>`
    : '';
  $('insight').innerHTML = (ins ? ins.items.map((t) => `<li>${esc(t.replace(/^·\s*/, ''))}</li>`).join('') : '<li class="empty">—</li>') + hwHtml;

  $('brief').textContent = today.brief?.markdown || '—';
  $('briefMeta').textContent = today.brief?.generatedAt ? new Date(today.brief.generatedAt).toLocaleString('zh-CN') : '';
}

function renderSpark(s) {
  const recent = (s.stats?.recent || []).slice(-7);
  if (!recent.length) { $('spark').innerHTML = '<div class="empty">暂无历史</div>'; return; }
  $('spark').innerHTML = recent.map((r) => {
    const h = Math.max(8, Math.round((Number(r.health_score) || 0) * 0.6));
    return `<div style="height:${h}px" title="${r.date_key} ${r.health_score}分"><span>${String(r.date_key).slice(5)}</span></div>`;
  }).join('');
  $('agentStats').innerHTML = [
    ['值守次数', s.stats.total],
    ['成功率', `${s.stats.successRate}%`],
    ['平均健康分', s.stats.avgHealthScore],
    ['记忆条目', s.stats.memoryCount],
    ['问题/洞察', s.stats.findings],
    ['高严重问题', s.stats.openIssues],
  ].map(([k, v]) => `<tr><td class="k">${esc(k)}</td><td>${esc(v)}</td></tr>`).join('');
}

function renderMemory(mem) {
  $('memory').innerHTML = mem.length
    ? mem.slice(0, 14).map((m) => `<tr>
        <td class="k">${esc(m.key)}</td>
        <td>${esc(typeof m.value === 'object' ? JSON.stringify(m.value) : m.value).slice(0, 120)}</td>
        <td><div>${m.confidence}</div><div class="bar"><i style="width:${Math.round(m.confidence * 100)}%"></i></div></td>
        <td>${m.hits}</td>
      </tr>`).join('')
    : '<tr><td colspan="4" class="empty">暂无记忆</td></tr>';
}

function renderFindings(list) {
  $('findings').innerHTML = list.length
    ? list.slice(0, 12).map((f) => `<li><span class="tag ${f.severity}">${esc(f.severity)}</span>${esc(f.title)}${f.detail ? `<div class="flash">${esc(f.detail)}</div>` : ''}</li>`).join('')
    : '<li class="empty">暂无问题记录</li>';
}

async function load() {
  try {
    const s = await api('/api/agent/status');
    LAST = s;
    $('conn').innerHTML = '<span class="dot ok"></span>后端已连接';
    renderKpis(s); renderRun(s); renderSpark(s);
    renderMemory(s.memory || []); renderFindings(s.findings || []);
  } catch (e) {
    $('conn').innerHTML = '<span class="dot failed"></span>后端未连接';
    $('headline').textContent = `无法连接 API 服务：${e.message}（请先启动 npm run server）`;
  }
}

async function doRun(force) {
  const btn = force ? $('btnForce') : $('btnRun');
  btn.disabled = true; btn.textContent = '运行中…';
  try {
    const r = await api('/api/agent/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ force: !!force }),
    });
    $('headline').innerHTML = `<span class="dot ${r.status}"></span>${esc(r.brief?.headline || '值守完成')}`;
    await load();
  } catch (e) {
    alert(`值守失败：${e.message}`);
  } finally {
    btn.disabled = false; btn.textContent = force ? '强制刷新今日' : '立即值守';
  }
}

$('btnRun').onclick = () => doRun(false);
$('btnForce').onclick = () => doRun(true);
$('btnPlan').onclick = async () => {
  try {
    const p = await api('/api/agent/plan');
    const lines = [
      '观测：',
      `  今日报告：${p.observation.today.hasReport ? '已存在' : '缺失'}`,
      `  真实数据源：${p.observation.live.ok ? '可用' : '不可用'}（${p.observation.live.detail}）`,
      `  历史缺口：${p.observation.gaps.length ? p.observation.gaps.join('、') : '无'}`,
      '',
      '决策：',
      ...p.plan.rationale.map((r) => `  - ${r}`),
      '',
      '动作序列：',
      ...p.plan.actions.map((a, i) => `  ${i + 1}. [${a.type}] ${a.reason || a.title || ''}`),
    ];
    alert(lines.join('\n'));
  } catch (e) { alert(`获取计划失败：${e.message}`); }
};

load();
setInterval(load, 60000);
</script>
</body>
</html>
