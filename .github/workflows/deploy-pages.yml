name: deploy-gh-pages

on:
  push:
    branches: [master]
    paths: ['tools/title-score/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy title-score to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./tools/title-score
          enable_jekyll: false
          commit_message: "deploy: title-score ${{ github.sha }}"
